name: Build and Release Cipher

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v2.3.4, etc.
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore Cipher.sln

    - name: Build x64 Release
      run: |
        msbuild Cipher.sln /p:Configuration=Release /p:Platform=x64 /p:OutputPath=bin\x64\Release /verbosity:minimal

    - name: Build x86 Release
      run: |
        msbuild Cipher.sln /p:Configuration=Release /p:Platform=x86 /p:OutputPath=bin\x86\Release /verbosity:minimal

    - name: Create build artifacts
      run: |
        # Create folders for each architecture
        mkdir Cipher_x64
        mkdir Cipher_x86

        # Copy x64 files
        copy bin\x64\Release\*.exe Cipher_x64\
        copy bin\x64\Release\*.dll Cipher_x64\
        copy bin\x64\Release\*.config Cipher_x64\ 2>nul || ver>nul

        # Copy x86 files
        copy bin\x86\Release\*.exe Cipher_x86\
        copy bin\x86\Release\*.dll Cipher_x86\
        copy bin\x86\Release\*.config Cipher_x86\ 2>nul || ver>nul

        # Create README files
        echo. > Cipher_x64\README.txt
        echo Cipher v1.0 - x64 Build >> Cipher_x64\README.txt
        echo. >> Cipher_x64\README.txt
        echo Release Date: %date% >> Cipher_x64\README.txt
        echo. >> Cipher_x64\README.txt
        echo 1. Run Cipher.exe as Administrator >> Cipher_x64\README.txt
        echo 2. Click "Add Mod" to add your mods >> Cipher_x64\README.txt
        echo 3. Click "Download" to download mod DLLs >> Cipher_x64\README.txt
        echo 4. Click "Inject" to inject into running games >> Cipher_x64\README.txt

        copy Cipher_x64\README.txt Cipher_x86\README.txt

        # Create ZIP files (if 7z is available)
        if exist "C:\Program Files\7-Zip\7z.exe" (
          "C:\Program Files\7-Zip\7z.exe" a -tzip Cipher_x64.zip Cipher_x64\
          "C:\Program Files\7-Zip\7z.exe" a -tzip Cipher_x86.zip Cipher_x86\
        ) else (
          # Fallback: just create folders as artifacts
          echo Skipping ZIP creation - 7-Zip not found
        )

    - name: Upload x64 Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cipher_x64
        path: Cipher_x64/

    - name: Upload x86 Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cipher_x86
        path: Cipher_x86/

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        name: Cipher ${{ github.ref_name }}
        draft: false
        prerelease: false
        body: |
          # 🔐 Cipher ${{ github.ref_name }}

          ## 🚀 Download
          - **[Cipher_x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Cipher_x64.zip)** - For 64-bit games (recommended)
          - **[Cipher_x86.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Cipher_x86.zip)** - For 32-bit games

          ## 📝 What's New
          - Full release build
          - Both x64 and x86 versions included
          - Ready to use, no installation required

          ## ⚠️ Important
          1. **Run as Administrator** - Required for DLL injection
          2. **Add antivirus exclusion** for `%APPDATA%\Cipher` folder
          3. **Use the correct version** - x64 for 64-bit games, x86 for 32-bit games

          ## 🛠️ Usage
          1. Extract the ZIP file to any folder
          2. Run `Cipher.exe` as Administrator
          3. Click "Add Mod" to add your mods
          4. Click "Download" to download mod DLLs
          5. Click "Inject" to inject into running games

        files: |
          Cipher_x64.zip
          Cipher_x86.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release without ZIP (fallback)
      if: startsWith(github.ref, 'refs/tags/') && !cancelled()
      uses: softprops/action-gh-release@v1
      with:
        name: Cipher ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          Cipher_x64/Cipher.exe
          Cipher_x86/Cipher.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
