name: Build and Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.cs'
      - '**/*.xaml'
      - '**/*.csproj'
      - '**/*.sln'
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore Cipher.sln

    - name: Build x64 Release
      run: |
        msbuild Cipher.sln /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

    - name: Build x86 Release
      run: |
        msbuild Cipher.sln /p:Configuration=Release /p:Platform=x86 /verbosity:minimal

    - name: Copy Single EXE (x64)
      shell: pwsh
      run: |
        # Find the x64 release folder
        $x64Path = if (Test-Path "Cipher\bin\x64\Release") { "Cipher\bin\x64\Release" } 
                   elseif (Test-Path "bin\x64\Release") { "bin\x64\Release" }
                   else { 
                     Write-Host "❌ x64 release folder not found!"
                     exit 1
                   }
        
        Write-Host "✅ x64 path: $x64Path"
        
        # Verify the EXE exists
        if (Test-Path "$x64Path\Cipher.exe") {
            Write-Host "✅ Cipher.exe found"
            Copy-Item "$x64Path\Cipher.exe" "Cipher_x64.exe" -Force
            $size = (Get-Item "Cipher_x64.exe").Length
            Write-Host "📊 EXE size: $size bytes"
        } else {
            Write-Host "❌ Cipher.exe NOT found!"
            Get-ChildItem $x64Path\
            exit 1
        }

    - name: Copy Single EXE (x86)
      shell: pwsh
      run: |
        # Find the x86 release folder
        $x86Path = if (Test-Path "Cipher\bin\x86\Release") { "Cipher\bin\x86\Release" } 
                   elseif (Test-Path "bin\x86\Release") { "bin\x86\Release" }
                   else { 
                     Write-Host "❌ x86 release folder not found!"
                     exit 1
                   }
        
        Write-Host "✅ x86 path: $x86Path"
        
        # Verify the EXE exists
        if (Test-Path "$x86Path\Cipher.exe") {
            Write-Host "✅ Cipher.exe found"
            Copy-Item "$x86Path\Cipher.exe" "Cipher_x86.exe" -Force
            $size = (Get-Item "Cipher_x86.exe").Length
            Write-Host "📊 EXE size: $size bytes"
        } else {
            Write-Host "❌ Cipher.exe NOT found!"
            Get-ChildItem $x86Path\
            exit 1
        }

    - name: Extract Version from Source
      id: get_version
      shell: pwsh
      run: |
        $content = Get-Content "Cipher\MainWindow.xaml.cs" -Raw
        $pattern = 'public static string Ver => "([^"]+)";'
        $match = [regex]::Match($content, $pattern)
        
        if ($match.Success) {
          $version = $match.Groups[1].Value
          Write-Host "✅ Extracted version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "❌ Version not found, using fallback"
          echo "version=unknown" >> $env:GITHUB_OUTPUT
        }

    - name: Upload x64 EXE as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cipher_x64
        path: Cipher_x64.exe

    - name: Upload x86 EXE as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cipher_x86
        path: Cipher_x86.exe

    - name: Download x64 Artifact
      uses: actions/download-artifact@v4
      with:
        name: Cipher_x64
        path: release_artifacts/

    - name: Download x86 Artifact
      uses: actions/download-artifact@v4
      with:
        name: Cipher_x86
        path: release_artifacts/

    - name: Verify Downloaded Artifacts
      shell: pwsh
      run: |
        Write-Host "📁 Contents of release_artifacts:"
        Get-ChildItem release_artifacts\
        
        if (Test-Path "release_artifacts/Cipher_x64.exe") {
            Write-Host "✅ Cipher_x64.exe found in release_artifacts"
        } else {
            Write-Host "❌ Cipher_x64.exe NOT found in release_artifacts"
            exit 1
        }
        
        if (Test-Path "release_artifacts/Cipher_x86.exe") {
            Write-Host "✅ Cipher_x86.exe found in release_artifacts"
        } else {
            Write-Host "❌ Cipher_x86.exe NOT found in release_artifacts"
            exit 1
        }

    - name: Delete existing nightly release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/github-script@v7
      with:
        script: |
          try {
            // Try to get the existing nightly release
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'nightly'
            });
            
            console.log(`🗑️ Deleting existing nightly release: ${release.name}`);
            
            // Delete the release
            await github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id
            });
            console.log(`✅ Deleted release: ${release.name}`);
            
            // Delete the tag
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/nightly'
              });
              console.log(`✅ Deleted tag: nightly`);
            } catch (e) {
              console.log(`⚠️ Could not delete tag: ${e.message}`);
            }
          } catch (e) {
            if (e.status === 404) {
              console.log(`ℹ️ No existing nightly release found`);
            } else {
              console.log(`⚠️ Error checking for nightly release: ${e.message}`);
            }
          }

    - name: Create Release (Nightly)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        name: Cipher Nightly (Latest)
        tag_name: nightly
        draft: false
        prerelease: false
        body: |
          # 🔐 Cipher Nightly Build (Latest)

          ## 🚀 Download (No installation required)
          - **[Cipher_x64.exe](https://github.com/${{ github.repository }}/releases/download/nightly/Cipher_x64.exe)** - For 64-bit games (recommended)
          - **[Cipher_x86.exe](https://github.com/${{ github.repository }}/releases/download/nightly/Cipher_x86.exe)** - For 32-bit games

          ## 📝 Build Information
          - **Version:** ${{ steps.get_version.outputs.version }}
          - **Commit:** ${{ github.sha }}
          - **Trigger:** ${{ github.event_name }}

          ## ⚠️ Important
          1. **Move to your Desktop & Add an antivirus exclusion for the file** - Required as the program uses CreateRemoteThread() for injecting DLL files.
          2. **Run as Administrator** - Required for DLL injection
          3. **Add antivirus exclusion** for `%APPDATA%\Cipher` folder - Required to store mod files in Cipher folder
          4. **Use the correct version** - x64 for 64-bit games, x86 for 32-bit games

          ## 🛠️ Usage
          1. Run `Cipher_x64.exe` or `Cipher_x86.exe` as Administrator
          2. Click "Add Mod" to add your mods
          3. Click "Download" to download mod DLLs
          4. Click "Start Game" to launch your game (First time use will display a prompt to enter the games path or protocol for launching)
          4. Click "Inject" to inject into running games

          ## 🛡️ Antivirus Exclusion
          Add an exclusion for: `%APPDATA%\Cipher` && `Cipher_<x64|x86>.exe` in Windows Defender or Other antivirus program.

        files: |
          release_artifacts/Cipher_x64.exe
          release_artifacts/Cipher_x86.exe

      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    - name: Create Release (Stable)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Cipher ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        body: |
          # 🔐 Cipher ${{ github.ref_name }}

          ## 🚀 Download (No installation required)
          - **[Cipher_x64.exe](https://github.com/${{ github.repository }}/releases/download/nightly/Cipher_x64.exe)** - For 64-bit games (recommended)
          - **[Cipher_x86.exe](https://github.com/${{ github.repository }}/releases/download/nightly/Cipher_x86.exe)** - For 32-bit games

          ## 📝 Build Information
          - **Version:** ${{ steps.get_version.outputs.version }}
          - **Commit:** ${{ github.sha }}
          - **Trigger:** ${{ github.event_name }}

          ## ⚠️ Important
          1. **Move to your Desktop & Add an antivirus exclusion for the file** - Required as the program uses CreateRemoteThread() for injecting DLL files.
          2. **Run as Administrator** - Required for DLL injection
          3. **Add antivirus exclusion** for `%APPDATA%\Cipher` folder - Required to store mod files in Cipher folder
          4. **Use the correct version** - x64 for 64-bit games, x86 for 32-bit games

          ## 🛠️ Usage
          1. Run `Cipher_x64.exe` or `Cipher_x86.exe` as Administrator
          2. Click "Add Mod" to add your mods
          3. Click "Download" to download mod DLLs
          4. Click "Start Game" to launch your game (First time use will display a prompt to enter the games path or protocol for launching)
          4. Click "Inject" to inject into running games

          ## 🛡️ Antivirus Exclusion
          Add an exclusion for: `%APPDATA%\Cipher` && `Cipher_<x64|x86>.exe` in Windows Defender or Other antivirus program.

        files: |
          release_artifacts/Cipher_x64.exe
          release_artifacts/Cipher_x86.exe
          
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
