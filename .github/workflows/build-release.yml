name: Build and Release Cipher (Signed)

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.cs'
      - '**/*.xaml'
      - '**/*.csproj'
      - '**/*.sln'
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore Cipher.sln

    - name: Build x64 Release
      run: |
        msbuild Cipher.sln /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

    - name: Build x86 Release
      run: |
        msbuild Cipher.sln /p:Configuration=Release /p:Platform=x86 /verbosity:minimal

    - name: Create README file
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        if ($version -eq "") { $version = "dev-build" }
        
        $readmeContent = @"
        Cipher v1.0 - $version
        ========================
        Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
        Build Hash: ${{ github.sha }}
        
        ## 🚀 Download (Single EXE - No installation required)
        - **Cipher_x64.exe** - For 64-bit games (RDR2, GTA5 Enhanced, modern games)
        - **Cipher_x86.exe** - For 32-bit games (GTA5 Legacy, older games)
        
        ## 📦 How to Use
        1. Download the correct EXE for your system
        2. Move to a trusted folder (e.g., C:\Program Files\Cipher\)
        3. Run as Administrator (right-click → Run as administrator)
        4. Click "Add Mod" to add your mods
        5. Click "Download" to download mod DLLs
        6. Click "Inject" to inject into running games
        
        ## ⚠️ Important
        1. **Run as Administrator** - Required for DLL injection
        2. **Add antivirus exclusion** for `%APPDATA%\Cipher` folder
        3. **Use the correct version** - x64 for 64-bit games, x86 for 32-bit games
        
        ## 🛡️ Antivirus Exclusion
        Add an exclusion for: `%APPDATA%\Cipher`
        
        For help, click the "Help" button in the app.
        "@
        $readmeContent | Out-File -FilePath README.txt -Encoding UTF8

    - name: Setup Signing Certificate
      shell: pwsh
      run: |
        # Decode the Base64 PFX back to a file
        $pfxBytes = [Convert]::FromBase64String("${{ secrets.PFX_BASE64 }}")
        [IO.File]::WriteAllBytes("$env:USERPROFILE\Cipher.pfx", $pfxBytes)
        Write-Host "✅ Certificate restored to: $env:USERPROFILE\Cipher.pfx"

    - name: Sign x64 EXE
      shell: pwsh
      run: |
        # Find the x64 release folder
        $x64Path = if (Test-Path "Cipher\bin\x64\Release") { "Cipher\bin\x64\Release" } 
                   elseif (Test-Path "bin\x64\Release") { "bin\x64\Release" }
                   else { 
                     Write-Host "❌ x64 release folder not found!"
                     exit 1
                   }
        
        Write-Host "✅ x64 path: $x64Path"
        
        # Sign the EXE
        & signtool sign /f "$env:USERPROFILE\Cipher.pfx" /p "${{ secrets.PFX_PASSWORD }}" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /a "$x64Path\Cipher.exe"
        
        if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Successfully signed x64 EXE"
        } else {
            Write-Host "❌ Failed to sign x64 EXE"
            exit 1
        }

    - name: Sign x86 EXE
      shell: pwsh
      run: |
        # Find the x86 release folder
        $x86Path = if (Test-Path "Cipher\bin\x86\Release") { "Cipher\bin\x86\Release" } 
                   elseif (Test-Path "bin\x86\Release") { "bin\x86\Release" }
                   else { 
                     Write-Host "❌ x86 release folder not found!"
                     exit 1
                   }
        
        Write-Host "✅ x86 path: $x86Path"
        
        # Sign the EXE
        & signtool sign /f "$env:USERPROFILE\Cipher.pfx" /p "${{ secrets.PFX_PASSWORD }}" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /a "$x86Path\Cipher.exe"
        
        if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ Successfully signed x86 EXE"
        } else {
            Write-Host "❌ Failed to sign x86 EXE"
            exit 1
        }

    - name: Copy Single EXE (x64)
      shell: pwsh
      run: |
        # Find the x64 release folder
        $x64Path = if (Test-Path "Cipher\bin\x64\Release") { "Cipher\bin\x64\Release" } 
                   elseif (Test-Path "bin\x64\Release") { "bin\x64\Release" }
                   else { 
                     Write-Host "❌ x64 release folder not found!"
                     exit 1
                   }
        
        # Copy to root with x64 name
        Copy-Item "$x64Path\Cipher.exe" "Cipher_x64.exe" -Force
        $size = (Get-Item "Cipher_x64.exe").Length
        Write-Host "📊 EXE size: $size bytes"

    - name: Copy Single EXE (x86)
      shell: pwsh
      run: |
        # Find the x86 release folder
        $x86Path = if (Test-Path "Cipher\bin\x86\Release") { "Cipher\bin\x86\Release" } 
                   elseif (Test-Path "bin\x86\Release") { "bin\x86\Release" }
                   else { 
                     Write-Host "❌ x86 release folder not found!"
                     exit 1
                   }
        
        # Copy to root with x86 name
        Copy-Item "$x86Path\Cipher.exe" "Cipher_x86.exe" -Force
        $size = (Get-Item "Cipher_x86.exe").Length
        Write-Host "📊 EXE size: $size bytes"

    - name: Upload x64 EXE as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cipher_x64
        path: Cipher_x64.exe

    - name: Upload x86 EXE as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cipher_x86
        path: Cipher_x86.exe

    - name: Upload README
      uses: actions/upload-artifact@v4
      with:
        name: README
        path: README.txt

    - name: Delete existing nightly releases
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: releases } = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          
          for (const release of releases) {
            if (release.tag_name && release.tag_name.startsWith('nightly-')) {
              console.log(`🗑️ Deleting release: ${release.tag_name}`);
              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
                console.log(`✅ Deleted release: ${release.tag_name}`);
              } catch (e) {
                console.log(`⚠️ Could not delete release: ${e.message}`);
              }
              
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`
                });
                console.log(`✅ Deleted tag: ${release.tag_name}`);
              } catch (e) {
                console.log(`⚠️ Could not delete tag: ${e.message}`);
              }
            }
          }

    - name: Download x64 Artifact
      uses: actions/download-artifact@v4
      with:
        name: Cipher_x64
        path: release_artifacts/

    - name: Download x86 Artifact
      uses: actions/download-artifact@v4
      with:
        name: Cipher_x86
        path: release_artifacts/

    - name: Download README
      uses: actions/download-artifact@v4
      with:
        name: README
        path: release_artifacts/

    - name: Verify Downloaded Artifacts
      shell: pwsh
      run: |
        Write-Host "📁 Contents of release_artifacts:"
        Get-ChildItem release_artifacts\
        
        if (Test-Path "release_artifacts/Cipher_x64.exe") {
            Write-Host "✅ Cipher_x64.exe found in release_artifacts"
        } else {
            Write-Host "❌ Cipher_x64.exe NOT found in release_artifacts"
            exit 1
        }
        
        if (Test-Path "release_artifacts/Cipher_x86.exe") {
            Write-Host "✅ Cipher_x86.exe found in release_artifacts"
        } else {
            Write-Host "❌ Cipher_x86.exe NOT found in release_artifacts"
            exit 1
        }

    - name: Create Release (Nightly) - SIGNED
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        name: Cipher Nightly #${{ github.run_number }}
        tag_name: nightly
        draft: false
        prerelease: true
        body: |
          # 🔐 Cipher Nightly Build

          ## 🚀 Download (Signed EXE - No installation required)
          - **[Cipher_x64.exe](https://github.com/${{ github.repository }}/releases/download/nightly/Cipher_x64.exe)** - For 64-bit games (recommended)
          - **[Cipher_x86.exe](https://github.com/${{ github.repository }}/releases/download/nightly/Cipher_x86.exe)** - For 32-bit games

          ## 📝 Build Information
          - **Build Number:** #${{ github.run_number }}
          - **Commit:** ${{ github.sha }}
          - **Trigger:** ${{ github.event_name }}

          ## 🔐 Signed with Self-Signed Certificate
          This EXE is digitally signed. You may still see a Windows warning because it's a self-signed certificate.

          ## ⚠️ Important
          1. **Run as Administrator** - Required for DLL injection
          2. **Add antivirus exclusion** for `%APPDATA%\Cipher` folder
          3. **Use the correct version** - x64 for 64-bit games, x86 for 32-bit games

          ## 🛠️ Usage
          1. Run `Cipher_x64.exe` or `Cipher_x86.exe` as Administrator
          2. Click "Add Mod" to add your mods
          3. Click "Download" to download mod DLLs
          4. Click "Inject" to inject into running games

          ## 🛡️ Antivirus Exclusion
          Add an exclusion for: `%APPDATA%\Cipher`

        files: |
          release_artifacts/Cipher_x64.exe
          release_artifacts/Cipher_x86.exe
          release_artifacts/README.txt
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    - name: Create Release (Stable) - SIGNED
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Cipher ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        body: |
          # 🔐 Cipher ${{ github.ref_name }}

          ## 🚀 Download (Signed EXE - No installation required)
          - **[Cipher_x64.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Cipher_x64.exe)** - For 64-bit games (recommended)
          - **[Cipher_x86.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Cipher_x86.exe)** - For 32-bit games

          ## 📝 What's New
          - Stable release build
          - Single EXE - no dependencies needed
          - Ready to use, no installation required
          - Digitally signed with self-signed certificate

          ## ⚠️ Important
          1. **Run as Administrator** - Required for DLL injection
          2. **Add antivirus exclusion** for `%APPDATA%\Cipher` folder
          3. **Use the correct version** - x64 for 64-bit games, x86 for 32-bit games

          ## 🛠️ Usage
          1. Run `Cipher_x64.exe` or `Cipher_x86.exe` as Administrator
          2. Click "Add Mod" to add your mods
          3. Click "Download" to download mod DLLs
          4. Click "Inject" to inject into running games

          ## 🛡️ Antivirus Exclusion
          Add an exclusion for: `%APPDATA%\Cipher`

        files: |
          release_artifacts/Cipher_x64.exe
          release_artifacts/Cipher_x86.exe
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
