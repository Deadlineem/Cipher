name: Build and Release Cipher

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.cs'
      - '**/*.xaml'
      - '**/*.csproj'
      - '**/*.sln'
  schedule:
    - cron: '0 */12 * * *'  # Runs every 12 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet packages
      run: nuget restore Cipher.sln

    - name: Build x64 Release
      run: |
        msbuild Cipher.sln /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

    - name: Build x86 Release
      run: |
        msbuild Cipher.sln /p:Configuration=Release /p:Platform=x86 /verbosity:minimal

    - name: Create build artifacts (PowerShell)
      shell: pwsh
      run: |
        # Create output folders
        New-Item -ItemType Directory -Force -Path Cipher_x64
        New-Item -ItemType Directory -Force -Path Cipher_x86

        # Copy x64 files - checking both possible locations
        Write-Host "📁 Current directory: $(Get-Location)"
        Write-Host "📁 Directory contents:"
        Get-ChildItem -Recurse -Directory | ForEach-Object { Write-Host "  $_" }

        # Try to find the x64 release folder
        $x64Path = if (Test-Path "Cipher\bin\x64\Release") { "Cipher\bin\x64\Release" } 
                   elseif (Test-Path "bin\x64\Release") { "bin\x64\Release" }
                   else { $null }
        
        $x86Path = if (Test-Path "Cipher\bin\x86\Release") { "Cipher\bin\x86\Release" } 
                   elseif (Test-Path "bin\x86\Release") { "bin\x86\Release" }
                   else { $null }

        if ($x64Path) {
            Write-Host "✅ Found x64 at: $x64Path"
            Copy-Item -Path "$x64Path\*" -Destination Cipher_x64\ -Recurse -Force
        } else {
            Write-Host "❌ x64 release folder not found!"
            Get-ChildItem -Recurse | Where-Object { $_.Name -like "*.exe" } | ForEach-Object { Write-Host "Found EXE: $($_.FullName)" }
            exit 1
        }

        if ($x86Path) {
            Write-Host "✅ Found x86 at: $x86Path"
            Copy-Item -Path "$x86Path\*" -Destination Cipher_x86\ -Recurse -Force
        } else {
            Write-Host "❌ x86 release folder not found!"
            exit 1
        }

        # Create README files
        $version = "${{ github.ref_name }}"
        if ($version -eq "") {
            $version = "dev-build"
        }
        
        $readmeContent = @"
        Cipher v1.0 - $version
        ========================
        Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
        Build Hash: ${{ github.sha }}
        
        1. Run Cipher.exe as Administrator
        2. Click "Add Mod" to add your mods
        3. Click "Download" to download mod DLLs
        4. Click "Inject" to inject into running games
        
        For help, click the "Help" button in the app.
        "@
        $readmeContent | Out-File -FilePath Cipher_x64\README.txt -Encoding UTF8
        $readmeContent | Out-File -FilePath Cipher_x86\README.txt -Encoding UTF8

        # Create ZIP files
        Compress-Archive -Path Cipher_x64\* -DestinationPath Cipher_x64.zip -Force
        Compress-Archive -Path Cipher_x86\* -DestinationPath Cipher_x86.zip -Force

        Write-Host "✅ Build artifacts created successfully!"

    - name: Upload x64 Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cipher_x64
        path: Cipher_x64/

    - name: Upload x86 Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cipher_x86
        path: Cipher_x86/

    - name: Upload ZIP Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Cipher_Archives
        path: |
          Cipher_x64.zip
          Cipher_x86.zip

    - name: Delete existing nightly releases
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: releases } = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          
          for (const release of releases) {
            if (release.tag_name && release.tag_name.startsWith('nightly-')) {
              console.log(`🗑️ Deleting release: ${release.tag_name}`);
              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
                console.log(`✅ Deleted release: ${release.tag_name}`);
              } catch (e) {
                console.log(`⚠️ Could not delete release: ${e.message}`);
              }
              
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`
                });
                console.log(`✅ Deleted tag: ${release.tag_name}`);
              } catch (e) {
                console.log(`⚠️ Could not delete tag: ${e.message}`);
              }
            }
          }

    - name: Create Release (Nightly)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        name: Cipher Nightly #${{ github.run_number }}
        tag_name: nightly-${{ github.run_number }}
        draft: false
        prerelease: true
        body: |
          # 🔐 Cipher Nightly Build #${{ github.run_number }}

          ## 🚀 Download
          - **[Cipher_x64.zip](https://github.com/${{ github.repository }}/releases/download/nightly-${{ github.run_number }}/Cipher_x64.zip)** - For 64-bit games (recommended)
          - **[Cipher_x86.zip](https://github.com/${{ github.repository }}/releases/download/nightly-${{ github.run_number }}/Cipher_x86.zip)** - For 32-bit games

          ## 📝 Build Information
          - **Build Number:** #${{ github.run_number }}
          - **Commit:** ${{ github.sha }}
          - **Branch:** ${{ github.ref_name }}
          - **Trigger:** ${{ github.event_name }}

          ## 📝 What's New
          - Latest development build
          - Both x64 and x86 versions included
          - Ready to use, no installation required

          ## ⚠️ Important
          1. **Run as Administrator** - Required for DLL injection
          2. **Add antivirus exclusion** for `%APPDATA%\Cipher` folder
          3. **Use the correct version** - x64 for 64-bit games, x86 for 32-bit games

          ## 🛠️ Usage
          1. Extract the ZIP file to any folder
          2. Run `Cipher.exe` as Administrator
          3. Click "Add Mod" to add your mods
          4. Click "Download" to download mod DLLs
          5. Click "Inject" to inject into running games

          ## 💡 Need Help?
          Click the "Help" button in the app for antivirus exclusion instructions.

        files: |
          Cipher_x64.zip
          Cipher_x86.zip
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    - name: Create Release (Stable)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Cipher ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        body: |
          # 🔐 Cipher ${{ github.ref_name }}

          ## 🚀 Download
          - **[Cipher_x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Cipher_x64.zip)** - For 64-bit games (recommended)
          - **[Cipher_x86.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Cipher_x86.zip)** - For 32-bit games

          ## 📝 What's New
          - Stable release build
          - Both x64 and x86 versions included
          - Ready to use, no installation required

          ## ⚠️ Important
          1. **Run as Administrator** - Required for DLL injection
          2. **Add antivirus exclusion** for `%APPDATA%\Cipher` folder
          3. **Use the correct version** - x64 for 64-bit games, x86 for 32-bit games

          ## 🛠️ Usage
          1. Extract the ZIP file to any folder
          2. Run `Cipher.exe` as Administrator
          3. Click "Add Mod" to add your mods
          4. Click "Download" to download mod DLLs
          5. Click "Inject" to inject into running games

          ## 💡 Need Help?
          Click the "Help" button in the app for antivirus exclusion instructions.

        files: |
          Cipher_x64.zip
          Cipher_x86.zip
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
